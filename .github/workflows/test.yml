name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  # Live Jev evals need a TypeSafe key. They run on main only, and only when
  # the repository has one configured, so forks and pull requests stay green
  # without secrets. Their full judgments are kept as artifacts.
  jev-evals:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: unit
    env:
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Skip without a key
        id: key
        run: echo "present=${{ secrets.TYPESAFE_API_KEY != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.key.outputs.present == 'true'
        run: node scripts/eval-intents.js
      - if: steps.key.outputs.present == 'true'
        run: node scripts/eval-decisions.js
      - if: always() && steps.key.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: jev-evals
          path: artifacts/*-eval-*.json
